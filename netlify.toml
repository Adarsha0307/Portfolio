[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA Fallback for React Router client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers translated from vercel.json
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://formspree.io https://ipapi.co https://script.google.com https://script.googleusercontent.com; base-uri 'self'; form-action 'self' https://formspree.io; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

