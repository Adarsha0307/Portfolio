<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Page not found — Adarsha B U</title>
    <meta name="description" content="The page you're looking for doesn't exist." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="%SITE_URL%/404" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { --color-bg: #0b0c0f; --color-text: #e8e6e1; --color-muted: #a0a7b0; --color-gold: #f5c042; --color-surface: #12141a; --color-line: #2a2f3b; }
      @media (prefers-color-scheme: light) { :root { --color-bg: #f6f4ef; --color-text: #17181c; --color-muted: #4a5059; --color-gold: #e8a81a; --color-surface: #ffffff; --color-line: #d4cfc3; } }
      html.dark, .dark { --color-bg: #0b0c0f; --color-text: #e8e6e1; --color-muted: #a0a7b0; --color-gold: #f5c042; --color-surface: #12141a; --color-line: #2a2f3b; }
      html:not(.dark) { --color-bg: #f6f4ef; --color-text: #17181c; --color-muted: #4a5059; --color-gold: #e8a81a; --color-surface: #ffffff; --color-line: #d4cfc3; }
      body { font-family: "Inter Variable", ui-sans-serif, system-ui, sans-serif; background: var(--color-bg); color: var(--color-text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; line-height: 1.6; }
      .container { text-align: center; max-width: 400px; }
      .code { font-family: "JetBrains Mono Variable", ui-monospace, monospace; font-size: 0.8125rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-gold); margin-bottom: 1rem; }
      h1 { font-family: "Space Grotesk Variable", ui-sans-serif, system-ui, sans-serif; font-weight: 600; letter-spacing: -0.02em; line-height: 1.08; font-size: clamp(2rem, 5vw, 3.4rem); margin-bottom: 1rem; }
      p { color: var(--color-muted); margin-bottom: 1.5rem; }
      .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; background: var(--color-gold); color: #17181c; font-weight: 500; border-radius: 0.375rem; text-decoration: none; transition: background 0.2s; }
      .btn:hover { background: #d4a01a; }
      .btn-ghost { background: transparent; border: 1px solid var(--color-line); color: var(--color-muted); }
      .btn-ghost:hover { border-color: var(--color-gold); color: var(--color-gold); }
      .btn-group { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      .theme-toggle { position: fixed; top: 1rem; right: 1rem; padding: 0.5rem; background: var(--color-surface); border: 1px solid var(--color-line); border-radius: 0.5rem; cursor: pointer; color: var(--color-text); }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'dark';
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div class="container">
      <p class="code">404</p>
      <h1>This page doesn't exist.</h1>
      <p>The link may be outdated, or the page moved. Either way — there's good work elsewhere.</p>
      <div class="btn-group">
        <a href="/" class="btn">Back home</a>
        <a href="/projects" class="btn btn-ghost">See projects</a>
      </div>
    </div>
    <button class="theme-toggle" aria-label="Toggle theme" onclick="toggleTheme()">
      <svg id="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="20" height="20" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="20" height="20"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
    <script>
      function toggleTheme() {
        var isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        document.getElementById('sun-icon').style.display = isDark ? 'block' : 'none';
        document.getElementById('moon-icon').style.display = isDark ? 'none' : 'block';
      }
      document.addEventListener('DOMContentLoaded', function() {
        var isDark = document.documentElement.classList.contains('dark');
        document.getElementById('sun-icon').style.display = isDark ? 'block' : 'none';
        document.getElementById('moon-icon').style.display = isDark ? 'none' : 'block';
      });
    </script>
  </body>
</html>
